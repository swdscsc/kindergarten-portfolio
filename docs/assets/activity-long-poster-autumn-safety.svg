 r="58" fill="#D4774E"/><text x="65" y="85" text-anchor="middle" fill="#FFFDF6" font-size="55">2</text><text x="165" y="60" fill="#203E31" font-size="42" font-weight="800">学习安全规则</text><text x="165" y="120" fill="#68776B" font-size="27">听从老师指引，不推挤、不逗留、不返回取物。</text></g><path d="M160 1765V1825" stroke="#D4774E" stroke-width="6" stroke-dasharray="8 12"/><g transform="translate(100 1870)"><circle cx="65" cy="65" r="58" fill="#315C4A"/><text x="65" y="85" text-anchor="middle" fill="#FFFDF6" font-size="55">3</text><text x="165" y="60" fill="#203E31" font-size="42" font-weight="800">养成自护习惯</text><text x="165" y="120" fill="#68776B" font-size="27">在成人陪伴下学习求助与安全行为。</text></g></g><rect x="80" y="2150" width="920" height="220" rx="30" fill="#315C4A"/><text x="540" y="2240" text-anchor="middle" fill="#FFFDF6" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="800">安全教育，从每一天开始</text><text x="540" y="2315" text-anchor="middle" fill="#DCE8D8" font-family="Microsoft YaHei,sans-serif" font-size="25">家园携手 · 共同守护 · 平安成长</text><text x="540" y="2440" text-anchor="middle" fill="#68776B" font-family="Microsoft YaHei,sans-serif" font-size="20">创意模拟宣传长图 · 非真实园所活动记录</text></svg>