<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2500" viewBox="0 0 1080 2500"><rect width="1080" height="2500" fill="#F3F0E8"/><rect x="38" y="38" width="1004" height="2424" fill="none" stroke="#1D3029" stroke-width="2"/><text x="82" y="112" font-family="sans-serif" font-size="22" letter-spacing="4" fill="#B43B2E">园务编辑部 / 活动主题提案</text><text x="82" y="300" font-family="serif" font-size="94" font-weight="700" fill="#1D3029">安全小卫士</text><text x="82" y="414" font-family="serif" font-size="94" font-weight="700" fill="#1D3029">平安伴成长</text><text x="84" y="490" font-family="sans-serif" font-size="28" fill="#53635A">认识标识 · 学习规则 · 知道求助</text><g transform="translate(820 370)"><circle r="125" fill="none" stroke="#B43B2E" stroke-width="3"/><path d="M0 -94L70 -68V8Q70 75 0 106Q-70 75-70 8V-68Z" fill="#1D4938"/><path d="M-35 8L-8 34L43 -32" fill="none" stroke="#F3F0E8" stroke-width="13"/></g><path d="M82 580H998" stroke="#1D3029" stroke-width="2"/><text x="82" y="680" font-family="serif" font-size="48" font-weight="700" fill="#1D3029">把提醒变成孩子会做的动作</text><g font-family="sans-serif"><rect x="82" y="750" width="916" height="300" fill="#E7E3D8"/><text x="125" y="820" font-size="20" letter-spacing="3" fill="#B43B2E">01 / 看见标识</text><text x="125" y="900" font-size="34" fill="#1D3029">认识安全出口与方向提示</text><text x="125" y="965" font-size="22" fill="#53635A">从熟悉的环境开始观察，先看图形，再听成人解释。</text><rect x="82" y="1090" width="916" height="300" fill="#E7E3D8"/><text x="125" y="1160" font-size="20" letter-spacing="3" fill="#B43B2E">02 / 学习规则</text><text x="125" y="1240" font-size="34" fill="#1D3029">排队慢行，不推挤、不追逐</text><text x="125" y="1305" font-size="22" fill="#53635A">把提醒拆成简单动作，在日常生活中反复练习。</text><rect x="82" y="1430" width="916" height="300" fill="#E7E3D8"/><text x="125" y="1500" font-size="20" letter-spacing="3" fill="#B43B2E">03 / 知道求助</text><text x="125" y="1580" font-size="34" fill="#1D3029">遇到问题，及时告诉可信赖的成人</text><text x="125" y="1645" font-size="22" fill="#53635A">让孩子知道可以表达需要，也可以主动寻求帮助。</text></g><path d="M82 1810H998" stroke="#1D3029" stroke-width="2"/><text x="82" y="1910" font-family="serif" font-size="46" font-weight="700" fill="#1D3029">家园可以一起做</text><g font-family="sans-serif" font-size="25" fill="#53635A"><text x="110" y="2000">— 外出时一起观察公共安全标识</text><text x="110" y="2070">— 乘梯、过马路时遵守成人指引</text><text x="110" y="2140">— 用简短、稳定的语言提醒孩子</text></g><rect x="82" y="2220" width="916" height="130" fill="#1D4938"/><text x="125" y="2295" font-family="sans-serif" font-size="26" fill="#F3F0E8">安全教育的目标，是让孩子逐渐知道该怎么做。</text><text x="82" y="2405" font-family="sans-serif" font-size="18" fill="#B43B2E">模拟活动视觉方案｜具体安排、场地和日期以园方审核为准</text></svg>