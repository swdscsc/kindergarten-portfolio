 <circle cx="0" cy="0" r="38" fill="#F2A36F"/><path d="M-15 0H15M0-15V15" stroke="#FFFDF6" stroke-width="9" stroke-linecap="round"/>
 <text x="0" y="75" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" fill="#FFFDF6">会自护</text>
</g>
<text x="540" y="1390" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" letter-spacing="4" fill="#E8EFE4">创意模拟海报 · 非真实园所活动记录</text>
