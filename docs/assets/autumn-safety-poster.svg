</g>
<g transform="translate(540 1180)">
 <circle cx="0" cy="0" r="38" fill="#F2A36F"/><path d="M-17 2L-3 16L20-15" fill="none" stroke="#FFFDF6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="0" y="75" text-anchor="middle" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" fill="#FFFDF6">学规则</text>
</g>
