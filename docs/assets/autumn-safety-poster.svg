<path d="M0 1150Q260 1080 540 1160T1080 1150V1440H0Z" fill="#315C4A"/>
<path d="M0 1260Q260 1190 540 1270T1080 1260" fill="none" stroke="#F7F4E9" stroke-width="8" stroke-dasharray="28 30" opacity=".75"/>
