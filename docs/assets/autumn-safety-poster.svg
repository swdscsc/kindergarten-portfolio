<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
<title id="title">安全小卫士，平安伴成长——秋季安全教育主题活动海报</title>
<desc id="desc">原创矢量插画海报，以奶油白、松柏绿和暖橙色呈现幼儿园安全教育主题。包含校园、道路、盾牌和安全标识图形。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F4E9"/><stop offset="1" stop-color="#E9EFE3"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47745B"/><stop offset="1" stop-color="#1F4A38"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2A36F"/><stop offset="1" stop-color="#D56F46"/></linearGradient>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#315C4A" opacity=".12"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#254735" flood-opacity=".13"/></filter>
</defs>
<rect width="1080" height="1440" fill="url(#bg)"/>
<circle cx="950" cy="140" r="250" fill="#E6D9C2" opacity=".55"/>
<circle cx="110" cy="1080" r="280" fill="#DCE8D8" opacity=".7"/>
<rect x="0" y="0" width="1080" height="1440" fill="url(#dots)" opacity=".65"/>
<path d="M0 930 C210 850 330 930 500 900 S820 820 1080 900 V1440 H0Z" fill="#DCE8D8"/>
<path d="M0 1100 C230 1000 380 1080 560 1050 S880 970 1080 1035 V1440 H0Z" fill="#C7D8C7" opacity=".65"/>
<!-- decorative leaves -->
<g fill="#5E8768" opacity=".65"><path d="M890 360c-70-78-52-150 18-180 35 70 22 128-18 180Z"/><path d="M915 390c22-100 84-130 145-93-26 76-74 108-145 93Z"/><path d="M135 800c-66-66-56-132 5-166 38 60 34 113-5 166Z"/></g>
<g fill="none" stroke="#315C4A" stroke-width="5" opacity=".35"><path d="M890 360Q940 250 1030 180"/><path d="M915 390Q1000 340 1060 300"/><path d="M135 800Q100 700 70 650"/></g>
<!-- top label -->
<rect x="82" y="76" width="300" height="54" rx="27" fill="#315C4A"/>
<text x="232" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#F7F4E9">AUTUMN SAFETY WEEK</text>
<text x="84" y="220" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" letter-spacing="7" fill="#D4774E">秋季安全教育主题活动</text>
<text x="76" y="345" font-family="'Noto Serif SC','Songti SC','Microsoft YaHei',serif" font-size="100" font-weight="800" letter-spacing="2" fill="#1F4938">安全小卫士</text>
<text x="76" y="465" font-family="'Noto Serif SC','Songti SC','Microsoft YaHei',serif" font-size="100" font-weight="800" letter-spacing="2" fill="#1F4938">平安伴成长</text>
<path d="M82 510H590" stroke="#D4774E" stroke-width="9" stroke-linecap="round"/>
<text x="84" y="580" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="32" fill="#52695A">认识安全标识 · 学习自护常识 · 养成安全习惯</text>
